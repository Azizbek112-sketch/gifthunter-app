<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gift Hunter WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body { background-color: #0d0f12; color: #ffffff; padding-bottom: 20px; overflow-x: hidden; }

    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #161920; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222733; }
    .balance-box { display: flex; align-items: center; gap: 6px; background: #202634; padding: 6px 14px; border-radius: 20px; font-weight: bold; border: 1px solid #2e364a; }
    .star-icon { color: #ffca28; font-size: 16px; }
    .deposit-btn { background: #0088cc; color: white; border: none; padding: 8px 16px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer; }

    /* Live Feed */
    .live-feed { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background: #12151c; border-bottom: 1px solid #1c2230; scrollbar-width: none; }
    .live-feed::-webkit-scrollbar { display: none; }
    .live-item { min-width: 44px; height: 44px; background: #1a202c; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid #2a3347; flex-shrink: 0; }

    /* Case Section */
    .container { padding: 16px; }
    .category-title { font-size: 14px; color: #8c9ba5; text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 10px 0; font-weight: bold; }
    .cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .case-card { background: #161a23; border-radius: 16px; padding: 14px; text-align: center; border: 1px solid #232a3a; cursor: pointer; transition: transform 0.1s; }
    .case-card:active { transform: scale(0.97); }
    .case-img { font-size: 48px; margin-bottom: 8px; }
    .case-name { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #e2e8f0; }
    .case-price { display: inline-flex; align-items: center; gap: 4px; background: #202736; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: bold; color: #ffca28; }

    /* Modal / Roulette View */
    .modal { display: none; position: fixed; inset: 0; background: #0d0f12; z-index: 200; flex-direction: column; justify-content: space-between; padding: 20px 16px; }
    .modal.active { display: flex; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: #202634; border: none; color: white; padding: 8px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; }

    .roulette-wrapper { position: relative; width: 100%; margin: auto 0; overflow: hidden; background: #161a23; border-radius: 16px; padding: 20px 0; border: 1px solid #232a3a; }
    .pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 14px solid #ffca28; z-index: 10; }
    .pointer-bottom { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 14px solid #ffca28; z-index: 10; }
    .roulette-track { display: flex; gap: 10px; transition: transform 4s cubic-bezier(0.15, 0.9, 0.25, 1); will-change: transform; }
    .prize-item { min-width: 90px; height: 90px; background: #202634; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #2e364a; font-size: 32px; gap: 4px; }
    .prize-item span { font-size: 10px; color: #8c9ba5; font-weight: bold; }

    .controls { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
    .open-btn { background: #0088cc; color: white; border: none; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
    .demo-toggle { display: flex; justify-content: space-between; align-items: center; background: #161a23; padding: 12px 16px; border-radius: 12px; font-size: 14px; color: #8c9ba5; border: 1px solid #232a3a; }

    /* Win Overlay */
    .win-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .win-overlay.active { display: flex; }
    .win-icon { font-size: 80px; margin-bottom: 12px; }
    .win-title { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
    .win-subtitle { font-size: 14px; color: #8c9ba5; margin-bottom: 24px; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="balance-box">
      <span class="star-icon">⭐</span>
      <span id="user-balance">0</span>
    </div>
    <button class="deposit-btn" onclick="alert('Balans to\'ldirish bo\'limi')">Top-up</button>
  </div>

  <!-- Live Feed -->
  <div class="live-feed" id="liveFeed">
    <div class="live-item">🎁</div>
    <div class="live-item">💎</div>
    <div class="live-item">🧸</div>
    <div class="live-item">🚀</div>
    <div class="live-item">👑</div>
  </div>

  <!-- Main Container -->
  <div class="container">
    <div class="category-title">Bepul keyslar</div>
    <div class="cases-grid">
      <div class="case-card" onclick="openCaseModal('Spider-Man', 0, '🕷️')">
        <div class="case-img">📦</div>
        <div class="case-name">Spider-Man</div>
        <div class="case-price">Free</div>
      </div>
      <div class="case-card" onclick="openCaseModal('Punks', 0, '🎃')">
        <div class="case-img">🧰</div>
        <div class="case-name">Punks</div>
        <div class="case-price">Free</div>
      </div>
    </div>

    <div class="category-title">Premium Keyslar</div>
    <div class="cases-grid">
      <div class="case-card" onclick="openCaseModal('Odyssey', 390, '👑')">
        <div class="case-img">🧳</div>
        <div class="case-name">The Odyssey</div>
        <div class="case-price">⭐ 390</div>
      </div>
      <div class="case-card" onclick="openCaseModal('ALL IN', 1190, '💎')">
        <div class="case-img">👑</div>
        <div class="case-name">ALL IN</div>
        <div class="case-price">⭐ 1190</div>
      </div>
    </div>
  </div>

  <!-- Modal / Game Window -->
  <div class="modal" id="gameModal">
    <div class="modal-header">
      <button class="close-btn" onclick="closeCaseModal()">Orqaga</button>
      <h3 id="modalTitle">Case Name</h3>
      <div style="width: 60px;"></div>
    </div>

    <div class="roulette-wrapper">
      <div class="pointer"></div>
      <div class="pointer-bottom"></div>
      <div class="roulette-track" id="rouletteTrack"></div>
    </div>

    <div class="controls">
      <div class="demo-toggle">
        <span>Demo-rejim (Sinov)</span>
        <input type="checkbox" id="demoMode" checked style="transform: scale(1.3);">
      </div>
      <button class="open-btn" id="spinBtn" onclick="spinRoulette()">Ochish</button>
    </div>
  </div>

  <!-- Win Result Screen -->
  <div class="win-overlay" id="winOverlay">
    <div class="win-icon" id="winIcon">🎁</div>
    <div class="win-title">Siz yutib oldingiz!</div>
    <div class="win-subtitle" id="winName">Sovg'a nomi</div>
    <button class="open-btn" onclick="closeWinOverlay()" style="width: 200px;">Davom etish</button>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const possiblePrizes = [
      { icon: '⭐ 125', name: '125 Stars' },
      { icon: '🧸', name: 'Teddy Bear' },
      { icon: '💎', name: 'Diamond' },
      { icon: '🚀', name: 'Rocket' },
      { icon: '👑', name: 'Crown' },
      { icon: '🎉', name: 'Party Horn' },
      { icon: '🏆', name: 'Trophy' }
    ];

    let currentPrice = 0;
    let isSpinning = false;

    function openCaseModal(title, price, icon) {
      document.getElementById('modalTitle').innerText = title;
      currentPrice = price;
      document.getElementById('spinBtn').innerText = price === 0 ? "Bepo'l Ochish" : `Ochish (⭐ ${price})`;
      buildTrack();
      document.getElementById('gameModal').classList.add('active');
    }

    function closeCaseModal() {
      if (!isSpinning) {
        document.getElementById('gameModal').classList.remove('active');
      }
    }

    function buildTrack() {
      const track = document.getElementById('rouletteTrack');
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';
      track.innerHTML = '';

      // Create 50 random items for scrolling effect
      for (let i = 0; i < 50; i++) {
        const item = possiblePrizes[Math.floor(Math.random() * possiblePrizes.length)];
        const el = document.createElement('div');
        el.className = 'prize-item';
        el.innerHTML = `${item.icon}<span>${item.name}</span>`;
        track.appendChild(el);
      }
    }

    function spinRoulette() {
      if (isSpinning) return;
      isSpinning = true;

      const track = document.getElementById('rouletteTrack');
      const itemWidth = 100; // item width + gap
      const winningIndex = 35 + Math.floor(Math.random() * 5); // Target index
      const offset = (winningIndex * itemWidth) - (window.innerWidth / 2) + (itemWidth / 2);

      track.style.transition = 'transform 4s cubic-bezier(0.15, 0.9, 0.25, 1)';
      track.style.transform = `translateX(-${offset}px)`;

      setTimeout(() => {
        const winningItem = track.children[winningIndex];
        const icon = winningItem.childNodes[0].textContent;
        const name = winningItem.querySelector('span').innerText;

        document.getElementById('winIcon').innerText = icon;
        document.getElementById('winName').innerText = name;
        document.getElementById('winOverlay').classList.add('active');
        isSpinning = false;
      }, 4100);
    }

    function closeWinOverlay() {
      document.getElementById('winOverlay').classList.remove('active');
      buildTrack();
    }
  </script>
</body>
</html>
