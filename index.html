<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gift Hunter App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
        body { background-color: #121318; color: #ffffff; padding-bottom: 70px; }
        
        /* Header & Balance */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; position: sticky; top: 0; background: #121318; z-index: 10; }
        .balance-container { display: flex; align-items: center; background: #1c1e24; padding: 6px 12px; border-radius: 20px; gap: 10px; border: 1px solid #2a2d37; }
        .balance-item { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; }
        
        .mode-toggle { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
        .mode-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid #2a2d37; background: #1c1e24; color: #fff; cursor: pointer; font-size: 13px; }
        .mode-btn.active { background: #fbc02d; color: #000; font-weight: bold; }

        /* Pages */
        .page { display: none; padding: 16px; }
        .page.active { display: block; }

        /* Cases Reel UI */
        .case-wrapper { position: relative; width: 100%; height: 110px; background: #1c1e24; border-radius: 12px; border: 1px solid #2a2d37; overflow: hidden; margin: 15px 0; }
        .case-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background: #fbc02d; z-index: 5; }
        .case-reel { display: flex; position: absolute; left: 0; top: 10px; transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1.2); }
        .case-item { width: 80px; height: 90px; background: #121318; margin: 0 5px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #2a2d37; flex-shrink: 0; }

        /* Slots Grid UI */
        .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #1c1e24; padding: 15px; border-radius: 16px; border: 1px solid #2a2d37; }
        .slot-box { background: #121318; height: 75px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 34px; border: 1px solid #2a2d37; overflow: hidden; }

        /* Buttons */
        .main-btn { width: 100%; background: #fbc02d; color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; margin-top: 15px; cursor: pointer; }
        .main-btn:disabled { opacity: 0.5; }

        /* Bottom Nav */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #16171e; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #222530; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #6b7280; cursor: pointer; }
        .nav-item.active { color: #fbc02d; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 20px;">☰</div>
        <div class="balance-container">
            <div class="balance-item">💎 <span id="gemsCount">0</span></div>
            <div class="balance-item">⭐ <span id="starsCount">50</span></div>
        </div>
    </div>

    <div class="mode-toggle">
        <button class="mode-btn active" id="realModeBtn" onclick="setMode('real')">Stars ⭐</button>
        <button class="mode-btn" id="demoModeBtn" onclick="setMode('demo')">Demo 🎮</button>
    </div>

    <!-- CASES PAGE -->
    <div id="page-cases" class="page active">
        <h3>🎁 Cases</h3>
        <div class="case-wrapper">
            <div class="case-pointer"></div>
            <div class="case-reel" id="caseReel"></div>
        </div>
        <button class="main-btn" id="openCaseBtn" onclick="openCase()">OPEN CASE (10 ⭐)</button>
    </div>

    <!-- SLOTS PAGE -->
    <div id="page-slots" class="page">
        <h3>🎰 Slots</h3>
        <div class="slots-grid">
            <div class="slot-box" id="slot1">🎁</div>
            <div class="slot-box" id="slot2">👑</div>
            <div class="slot-box" id="slot3">🍦</div>
        </div>
        <button class="main-btn" id="spinSlotsBtn" onclick="spinSlots()">SPIN (10 ⭐)</button>
    </div>

    <!-- NAV BAR -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="navTo('page-cases', this)"><div>🎁</div><div>Cases</div></div>
        <div class="nav-item" onclick="navTo('page-slots', this)"><div>🎰</div><div>Slots</div></div>
    </div>

    <script>
        let isDemo = false;
        let stars = 50;
        let demoBalance = 1000;
        let inventory = [];

        const items = [
            { id: 1, name: "Gift Box", icon: "🎁", price: 15 },
            { id: 2, name: "Crown", icon: "👑", price: 50 },
            { id: 3, name: "Ice Cream", icon: "🍦", price: 10 },
            { id: 4, name: "Teddy", icon: "🧸", price: 25 }
        ];

        function setMode(mode) {
            isDemo = (mode === 'demo');
            document.getElementById('realModeBtn').classList.toggle('active', !isDemo);
            document.getElementById('demoModeBtn').classList.toggle('active', isDemo);
            updateBalanceUI();
        }

        function updateBalanceUI() {
            document.getElementById('starsCount').innerText = isDemo ? demoBalance : stars;
        }

        function navTo(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        // Init Case Reel
        const reel = document.getElementById('caseReel');
        function initReel() {
            reel.innerHTML = '';
            for(let i=0; i<30; i++) {
                const item = items[Math.floor(Math.random()*items.length)];
                reel.innerHTML += `<div class="case-item"><span style="font-size:28px">${item.icon}</span><span style="font-size:10px">${item.name}</span></div>`;
            }
        }
        initReel();

        function openCase() {
            let bal = isDemo ? demoBalance : stars;
            if(bal < 10) return alert("Balans yetarli emas!");

            if(isDemo) demoBalance -= 10; else stars -= 10;
            updateBalanceUI();

            const btn = document.getElementById('openCaseBtn');
            btn.disabled = true;

            const randomShift = Math.floor(Math.random() * 1500) + 800;
            reel.style.transform = `translateX(-${randomShift}px)`;

            setTimeout(() => {
                btn.disabled = false;
                alert("Case ochildi!");
            }, 3200);
        }

        function spinSlots() {
            let bal = isDemo ? demoBalance : stars;
            if(bal < 10) return alert("Balans yetarli emas!");

            if(isDemo) demoBalance -= 10; else stars -= 10;
            updateBalanceUI();

            let spins = 0;
            const timer = setInterval(() => {
                document.getElementById('slot1').innerText = items[Math.floor(Math.random()*items.length)].icon;
                document.getElementById('slot2').innerText = items[Math.floor(Math.random()*items.length)].icon;
                document.getElementById('slot3').innerText = items[Math.floor(Math.random()*items.length)].icon;
                spins++;
                if(spins > 12) clearInterval(timer);
            }, 80);
        }
    </script>
</body>
</html>
